<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uconnect Hardware Panel</title>
<style>
  :root { --bg: #111; --panel: #1c1c1c; --btn: #2a2a2a; --btn-hi: #3a3a3a; --fg: #eee; --dim: #999; --accent: #c8102e; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  section { background: var(--panel); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: var(--btn); color: var(--fg); border: 0; border-radius: 6px; padding: 10px 14px; font: inherit; cursor: pointer; min-width: 44px; }
  button:hover { background: var(--btn-hi); }
  button:active { background: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea { width: 100%; box-sizing: border-box; height: 70px; background: #000; color: var(--fg); border: 1px solid #333; border-radius: 6px; font: 12px ui-monospace, monospace; }
  #status { color: var(--dim); font-size: 12px; min-height: 1em; }
  kbd { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<h1>Uconnect 8.4AN — hardware panel</h1>

<section>
  <h2>Volume / Tune</h2>
  <div class="row">
    <button data-a="volume" data-v="-1" title="Volume down (-)">Vol −</button>
    <button data-a="volume" data-v="1" title="Volume up (+)">Vol +</button>
    <button data-a="key" data-v="audioOnOff" title="Mute (M)">Mute</button>
    <button data-a="tune" data-v="-1" title="Tune/scroll left (←)">◀ Tune</button>
    <button data-a="key" data-v="enter" title="Enter (Enter)">Enter</button>
    <button data-a="tune" data-v="1" title="Tune/scroll right (→)">Tune ▶</button>
    <button data-a="key" data-v="back" title="Back (Backspace)">Back</button>
    <button data-a="key" data-v="browse">Browse</button>
  </div>
</section>

<section>
  <h2>Faceplate buttons</h2>
  <div class="row">
    <button data-a="key" data-v="radio">Radio</button>
    <button data-a="key" data-v="player">Media</button>
    <button data-a="key" data-v="nav">Nav</button>
    <button data-a="key" data-v="phone">Phone</button>
    <button data-a="key" data-v="more">Apps</button>
    <button data-a="key" data-v="settings">Settings</button>
    <button data-a="key" data-v="screenOff">Screen off</button>
  </div>
</section>

<section>
  <h2>Climate knobs</h2>
  <div class="row">
    <button data-a="temp" data-v="frontLeft:-">Driver −</button>
    <button data-a="temp" data-v="frontLeft:+">Driver +</button>
    <button data-a="temp" data-v="frontRight:-">Passenger −</button>
    <button data-a="temp" data-v="frontRight:+">Passenger +</button>
  </div>
</section>

<section>
  <h2>Vehicle</h2>
  <div class="row">
    <button data-a="gear" data-v="1">Shift to R (backup camera)</button>
    <button data-a="gear" data-v="0">Shift to P</button>
  </div>
</section>

<section>
  <h2>Raw backend frame</h2>
  <textarea id="raw" spellcheck="false">{"Tuner":{"stationInfo":{"frequency":95500,"waveband":"FM","senderName":"WPLJ","pi":0,"rxQual":5,"pty":""}}}</textarea>
  <div class="row" style="margin-top:6px"><button id="send">Send to HMI</button></div>
</section>

<div id="status" role="status"></div>

<script>
  const status = document.getElementById('status');
  async function act(action, value) {
    try {
      const r = await fetch('/act', { method: 'POST', body: JSON.stringify({ action, value }) });
      status.textContent = r.ok ? `${action} ${value}` : `rejected: ${action} ${value}`;
    } catch (e) {
      status.textContent = 'backend not reachable — is run.bat running?';
    }
  }
  document.querySelectorAll('button[data-a]').forEach(b =>
    b.addEventListener('click', () => act(b.dataset.a, b.dataset.v)));
  document.getElementById('send').addEventListener('click', () => act('inject', document.getElementById('raw').value));
  const keys = { '+': ['volume', '1'], '=': ['volume', '1'], '-': ['volume', '-1'], 'm': ['key', 'audioOnOff'],
                 'ArrowLeft': ['tune', '-1'], 'ArrowRight': ['tune', '1'], 'Enter': ['key', 'enter'], 'Backspace': ['key', 'back'] };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || !keys[e.key]) return;
    e.preventDefault();
    act(...keys[e.key]);
  });
</script>
</body>
</html>
